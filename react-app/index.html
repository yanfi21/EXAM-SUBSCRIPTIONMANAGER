<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Менеджер личных задач и заметок: список, канбан-доска, календарь, статистика" />
    <meta name="color-scheme" content="light dark" />
    <title>Задачи и заметки — React</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('tasknotes.preferences');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          void e;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
