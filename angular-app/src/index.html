<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Задачи и заметки — Angular</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Менеджер личных задач и заметок: список, канбан-доска, календарь, статистика"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('tasknotes.preferences');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          void e;
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
