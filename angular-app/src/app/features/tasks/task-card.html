<article class="card p-4 transition hover:shadow-md" [class.opacity-75]="done()">
  <div class="flex items-start gap-3">
    <button
      type="button"
      class="mt-0.5 flex h-6 w-6 shrink-0 cursor-pointer items-center justify-center rounded-lg border transition"
      [class]="
        done()
          ? 'border-success bg-success text-white'
          : 'border-border text-transparent hover:border-brand'
      "
      [attr.aria-pressed]="done()"
      [attr.aria-label]="done() ? 'Отметить как невыполненную' : 'Отметить как выполненную'"
      (click)="toggle()"
    >
      <app-icon name="check" [size]="14" />
    </button>

    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center gap-2">
        <h3 class="text-sm font-semibold break-words text-ink" [class.line-through]="done()">
          {{ task().title }}
        </h3>
        <app-priority-badge [priority]="task().priority" />
        @if (task().dueDate) {
          <app-due-badge [label]="deadline()" [overdue]="overdue()" />
        }
      </div>

      @if (task().description) {
        <p class="muted mt-1.5 line-clamp-3 whitespace-pre-line">{{ task().description }}</p>
      }

      @if (task().tags.length) {
        <div class="mt-3 flex flex-wrap items-center gap-2">
          @for (tag of task().tags; track tag) {
            <button
              type="button"
              class="chip cursor-pointer hover:border-brand hover:text-brand"
              (click)="preferences.toggleTag(tag)"
            >
              #{{ tag }}
            </button>
          }
        </div>
      }

      <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-1.5">
          @for (status of statuses; track status) {
            <button
              type="button"
              class="chip cursor-pointer"
              [class.chip-active]="task().status === status"
              (click)="setStatus(status)"
            >
              {{ statusLabels[status] }}
            </button>
          }
        </div>
        <div class="flex items-center gap-1">
          <span class="muted hidden text-xs sm:inline">{{ updated() }}</span>
          <button
            type="button"
            class="btn btn-ghost btn-sm"
            aria-label="Редактировать задачу"
            (click)="dialog.openEdit(task())"
          >
            <app-icon name="edit" [size]="15" />
          </button>
          <button
            type="button"
            class="btn btn-ghost btn-sm text-danger"
            aria-label="Удалить задачу"
            (click)="remove()"
          >
            <app-icon name="trash" [size]="15" />
          </button>
        </div>
      </div>
    </div>
  </div>
</article>
